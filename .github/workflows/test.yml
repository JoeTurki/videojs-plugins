name: Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Test (${{ matrix.os }} - ${{ matrix.browser }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        browser:
          - name: chrome
            os: [ubuntu-latest, windows-latest]
          - name: firefox
            os: [ubuntu-latest]
          - name: edge
            os: [windows-latest]
          - name: safari
            os: [macos-latest]
        include:
          - os: ubuntu-latest
            browser: chrome
          - os: ubuntu-latest
            browser: firefox
          - os: windows-latest
            browser: chrome
          - os: windows-latest
            browser: edge
          - os: macos-latest
            browser: safari
        exclude:
          - os: ubuntu-latest
            browser: edge
          - os: ubuntu-latest
            browser: safari
          - os: windows-latest
            browser: firefox
          - os: windows-latest
            browser: safari
          - os: macos-latest
            browser: chrome
          - os: macos-latest
            browser: firefox
          - os: macos-latest
            browser: edge

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:browser
        env:
          TEST_BROWSER: ${{ matrix.browser }}
          TEST_HEADLESS: true
